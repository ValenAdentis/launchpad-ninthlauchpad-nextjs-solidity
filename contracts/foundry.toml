[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
